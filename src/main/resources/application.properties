server.port = 8080
server.servlet.context-path=/ServidorDicomFHES

spring.application.name=ServidorDicomFHES

logging.pattern.console="%date{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
logging.pattern.file="%date{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
logging.level.net.fhes = DEBUG
logging.level.org.springframework.web = INFO
logging.level.org.hibernate = INFO

# DEV
dev.urlConfiguracio = https://entitydev.fhes.cat/ConfiguracioAplicacions/config/carregarValors?idApp=3

#PRODUCCIO
produccio.urlConfiguracio = https://database.fhes.cat/ConfiguracioAplicacions/config/carregarValors?idApp=3

# Fallback local cuando ConfiguracioAplicacions no esta disponible.
config.valors.file=${CONFIG_VALORS_FILE:classpath:config-valors.json}

# Asistente IA. La clave real se proporciona mediante la variable OPENAI_API_KEY.
ai.openai.enabled=${OPENAI_ENABLED:true}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-5.6-terra}
ai.openai.url=${OPENAI_URL:https://api.openai.com/v1/responses}
ai.openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:90}
ai.openai.max-image-bytes=${OPENAI_MAX_IMAGE_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
